generations:
  - name: "First Generation (E36/7, E36/8) Pre-Facelift"
    start_year: 1995
    end_year: 1999
    description: "The BMW Z3 was the company's first mass-produced roadster, initially gaining fame through its appearance in the James Bond film 'GoldenEye' before its market launch. Built at BMW's Spartanburg plant in South Carolina, it was primarily designed for the American market. The roadster (E36/7) launched in September 1995 with 1.8L four-cylinder engines, with 6-cylinder options arriving in 1996, expanding to include various six-cylinder units up to the 3.2L in the M Roadster. The M Roadster was introduced in 1997. In January 1998, the lineup expanded to include the Z3 Coupe (E36/8), featuring distinctive 'shooting brake' styling often referred to as the 'clown shoe' due to its unique profile. The high-performance M Coupe variant featured the same 3.2L engine as the M Roadster. The Z3 combined classic roadster proportions including a long hood and short deck with distinctive BMW design elements like the kidney grille and quad headlights. The pre-facelift interior was relatively spartan but driver-focused. The Z3 established BMW in the premium compact sports car segment, competing with vehicles like the Porsche Boxster and Mercedes-Benz SLK."
  - name: "First Generation (E36/7, E36/8) 1999 Facelift"
    start_year: 1999
    end_year: 2002
    description: "In April 1999, the Z3 received a comprehensive facelift (LCI) with major visual and technical updates. Exterior changes included redesigned chrome ring headlights, L-shaped taillights replacing the original design, wider rear track (increased by 64mm to match 4-cylinder and 6-cylinder models), new wheel designs, model designation badges, and chrome exhaust tips. Interior updates featured a redesigned centre console with integrated clock, new three-spoke steering wheel, and dual-stage side airbags. Engine lineup was upgraded with the new M54 inline-six replacing the M52 (the '2.0' became '2.2i', '2.8' became '3.0i'). The Z3M models (both roadster and coupe) did not receive these exterior cosmetic changes but continued with their performance focus. Electronic stability control was upgraded from ASC to the new DSC system, later integrated with Dynamic Brake Control (DBC) and Automatic Differential Brake (ADB) functions. A new three-layer insulation convertible roof with headlining was introduced. Production ended June 28, 2002, with the Z3 line replaced by the E85 Z4."
